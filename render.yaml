# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: snippets-api
    runtime: node
    # A persistent disk needs a paid plan; the free plan's filesystem is wiped on every deploy/restart.
    plan: starter
    # devDependencies (typescript) are needed to build, so include them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # SQLite lives on this disk. Disks pin the service to a single instance,
    # which is what SQLite needs anyway.
    disk:
      name: snippets-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # PORT is set by Render automatically; the app reads it.
      - key: DB_PATH
        value: /var/data/snippets.db
      # Exact web origin, e.g. https://snippets-web.onrender.com (no trailing slash).
      # Render prompts for it when the Blueprint is created.
      - key: CORS_ORIGIN
        sync: false
      # Random 256-bit value generated by Render on first deploy.
      # Copy it from the dashboard into snippets-web's server-only env.
      - key: ADMIN_KEY
        generateValue: true
